name: Deploy MiroTalk with Cloudflare Quick Tunnel

on:
  workflow_dispatch:   # امکان اجرای دستی از تب Actions

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 360   # حداکثر ۶ ساعت (محدودیت GitHub Actions)

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'   # MiroTalk با Node.js 20 سازگاره

      - name: Install dependencies
        run: npm ci

      - name: Create config files from templates
        run: |
          cp .env.template .env
          cp app/src/config.template.js app/src/config.js

      - name: Start MiroTalk server (background)
        run: |
          npm start &
          # چند ثانیه صبر می‌کنیم تا سرور کامل بالا بیاد
          sleep 10
          # بررسی اینکه سرور روی پورت ۳۰۰۰ در حال اجراست
          curl -s -o /dev/null -w "%{http_code}" http://localhost:3000 || true

      - name: Install cloudflared
        run: |
          wget -q https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
          sudo dpkg -i cloudflared-linux-amd64.deb

      - name: Start Cloudflare Quick Tunnel
        run: |
          # این دستور یک URL موقت *.trycloudflare.com تولید می‌کنه
          cloudflared tunnel --url http://localhost:3000
        # این مرحله تا زمانی که workflow لغو نشه یا timeout بخوره اجرا می‌مونه
        # و خروجی اون شامل آدرس trycloudflare.com خواهد بود
