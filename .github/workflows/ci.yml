name: Deploy MiroTalk with Cloudflare Quick Tunnel

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Prepare config files
        run: |
          cp .env.template .env
          test -f app/src/config.js || cp app/src/config.template.js app/src/config.js

      - name: Start MiroTalk and Cloudflare Tunnel
        run: |
          echo "▶ Starting MiroTalk..."
          nohup npm start > mirotalk.log 2>&1 &
          echo $! > mirotalk.pid

          sleep 15

          if ! kill -0 $(cat mirotalk.pid) 2>/dev/null; then
            echo "❌ MiroTalk failed to start. Logs:"
            cat mirotalk.log
            exit 1
          fi

          echo "✅ MiroTalk is running on port 3000"
          tail -n 20 mirotalk.log

          echo "▶ Installing cloudflared..."
          wget -q https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
          sudo dpkg -i cloudflared-linux-amd64.deb

          echo "▶ Starting Cloudflare Quick Tunnel..."
          cloudflared tunnel --url http://localhost:3000
