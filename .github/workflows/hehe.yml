name: Deploy MiroTalk with Cloudflare Quick Tunnel

on:
  workflow_dispatch:   # اجرای دستی از تب Actions

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 350   # حدود ۵ ساعت و ۵۰ دقیقه (حداکثر مجاز ۳۶۰ دقیقه)

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'   # یا '22.22.2' — حتماً ۲۲.۲۲.۲ یا بالاتر
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Start MiroTalk and Cloudflare Tunnel
        run: |
          # آماده‌سازی فایل‌های تنظیمات
          cp .env.template .env
          test -f app/src/config.js || cp app/src/config.template.js app/src/config.js

          echo "▶ Starting MiroTalk..."
          nohup npm start > mirotalk.log 2>&1 &
          echo $! > mirotalk.pid

          # کمی صبر تا سرور بالا بیاید
          sleep 15

          # بررسی اینکه سرور واقعاً در حال اجراست
          if ! kill -0 $(cat mirotalk.pid) 2>/dev/null; then
            echo "❌ MiroTalk failed to start. Logs:"
            cat mirotalk.log
            exit 1
          fi

          echo "✅ MiroTalk is running on port 3000"

          # نصب cloudflared
          echo "▶ Installing cloudflared..."
          wget -q https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
          sudo dpkg -i cloudflared-linux-amd64.deb

          # اجرای تونل سریع Cloudflare
          echo "▶ Starting Cloudflare Quick Tunnel..."
          cloudflared tunnel --url http://localhost:3000
